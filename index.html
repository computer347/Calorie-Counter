<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kcal">
<meta name="theme-color" content="#0d0e12">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Kcal</title>
<style>
:root{--bg:#0e0f12;--card:#17181d;--card2:#22242b;--line:#2b2e37;--text:#f2f3f5;--muted:#8b8f9a;--acc:#5ad67d;--p:#5aa9ff;--c:#ffb454;--f:#ff6b8a;--warn:#e5a50a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.6px;font-weight:800}
h2{font-size:12px;margin:22px 2px 8px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:800}.r{text-align:right}
.btn{background:var(--card2);color:var(--text);border:0;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.btn.acc{background:var(--acc);color:#0b1a10}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn:disabled{opacity:.45}
.btn.danger{color:var(--f)}
.f{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;margin:4px 0 10px}
label.small{display:block;margin-top:4px}
.adds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.adds button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;font-size:12px}
.adds svg{width:24px;height:24px}
.ring{position:relative;width:150px;height:150px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1}.ring .mid span{font-size:11px;color:var(--muted);margin-top:3px}
.mac{flex:1}.mac .lbl{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 3px}.bar{height:7px;background:var(--card2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.meal{margin-bottom:10px}.meal .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-weight:800}
.ent{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:6px}
.ent .nm{flex:1;min-width:0}.ent .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .k{font-weight:800;font-variant-numeric:tabular-nums}
.day{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:6px}
.res{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}.res:last-child{border:0}.res .nm{flex:1;min-width:0;margin-right:8px}
.src{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-left:6px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}#nav button.on{color:var(--acc)}#nav svg{width:22px;height:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:19px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:12px 18px;border-radius:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;border-left:5px solid var(--acc)}
video{width:100%;border-radius:14px;background:#000;max-height:50vh;object-fit:cover}
img.ph{width:100%;border-radius:14px;max-height:40vh;object-fit:contain;background:#000}
.ai{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.ai input[type=number]{width:70px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:15px;text-align:right}
.ai .nm{flex:1;min-width:0}.lo{color:var(--warn)}
.dots{display:inline-block;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}.bars i.over{background:var(--f)}.bars i.none{background:var(--card2)}
.stat{flex:1;background:var(--card2);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px;font-weight:800}.stat span{font-size:11px;color:var(--muted)}
.streak{font-size:13px;color:var(--acc);font-weight:700}
details summary{cursor:pointer}
ol{padding-left:18px}ol li{margin-bottom:6px}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"></nav>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="imp" accept="application/json" hidden>
<script>
// ================= state =================
const KEY='kcal.v1',LIFTS='mikelifts.v1',DAY=864e5;
const defaults=()=>({settings:{key:'',api:'studio',model:'gemini-3.8-flash',margin:10,marginText:5,sex:'m',age:30,height:180,bw:80,activity:1.375,rate:0,protein:1.8,fatPct:30,adaptive:true,addWorkout:true,water:2000,shortcut:'Log Food Calories'},log:{},foods:[],weight:[],water:{}});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){const d=defaults(),m={...d,...s,settings:{...d.settings,...s.settings}};if(['gemini-2.5-flash','gemini-3-flash-preview'].includes(m.settings.model))m.settings.model=d.settings.model;return m}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full')}}
// Lifts bridge: READ ONLY. Same origin shares localStorage, so weights and session kcal from the gym app appear here. Never written.
function lifts(){try{return JSON.parse(localStorage.getItem(LIFTS))}catch(e){return null}}
function liftsKcal(iso){const L=lifts();return L?L.sessions.filter(s=>isoD(s.date)===iso).reduce((a,s)=>a+(s.kcal||0),0):0}
function allWeights(){const L=lifts(),w=[...S.weight.map(x=>({...x,src:'kcal'})),...(L?L.body.filter(b=>b.weight).map(b=>({date:b.date,kg:b.weight,src:'lifts'})):[])];return w.sort((a,b)=>a.date-b.date)}

// ================= helpers =================
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoD(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const dayMs=iso=>new Date(iso+'T12:00:00').getTime(),addD=(iso,n)=>isoD(dayMs(iso)+n*DAY),today=()=>isoD(Date.now());
const r0=x=>Math.round(x||0),r1=x=>Math.round((x||0)*10)/10;
const fmtDay=iso=>{const t=today();return iso===t?'Today':iso===addD(t,-1)?'Yesterday':new Date(dayMs(iso)).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);return m}
function closeModal(){stopCam();document.querySelectorAll('.modal').forEach(m=>m.remove())}
const MEALS=[['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s','Snacks']],mealName=k=>MEALS.find(m=>m[0]===k)[1];
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?'b':h<14.5?'l':h<20?'d':'s'}
const entries=iso=>S.log[iso]||[];
const kcal=e=>e.per.k*e.g/100,mac=(e,m)=>(e.per[m]||0)*e.g/100;
function totals(iso){const t={k:0,p:0,c:0,f:0,fi:0,sa:0,su:0};entries(iso).forEach(e=>{for(const m in t)t[m]+=m==='k'?kcal(e):mac(e,m)});return t}
let S=load(),tab='today',day=today();

// ================= targets =================
function latestWeight(){const w=allWeights();return w.length?w.at(-1).kg:S.settings.bw}
function bmr(){const s=S.settings,w=latestWeight();return 10*w+6.25*s.height-5*s.age+(s.sex==='m'?5:-161)}
function formulaTdee(iso){return bmr()*S.settings.activity+(S.settings.addWorkout?liftsKcal(iso):0)}
// Adaptive expenditure (MacroFactor-style): mean intake minus energy stored as weight change over the last 28 logged days.
function adaptive(){const end=addD(today(),-1),start=addD(end,-27),days=[];for(let d=start;d<=end;d=addD(d,1))if(entries(d).length)days.push(d);
 if(days.length<14)return null;const w=allWeights().filter(x=>isoD(x.date)>=addD(start,-7)&&isoD(x.date)<=end);if(w.length<4||w.at(-1).date-w[0].date<14*DAY)return null;
 let tr=w[0].kg;const trend=w.map(x=>tr=tr+.25*(x.kg-tr));const dkg=trend.at(-1)-trend[0],span=(w.at(-1).date-w[0].date)/DAY;
 const intake=days.reduce((a,d)=>a+totals(d).k,0)/days.length;return{tdee:r0(intake-dkg*7700/span),days:days.length,dkg:r1(dkg),span:r0(span)}}
function target(iso){const s=S.settings,a=s.adaptive&&adaptive();const base=a?a.tdee:formulaTdee(iso);const k=r0(base+s.rate*1100);
 const p=r0(s.protein*latestWeight()),f=r0(k*s.fatPct/100/9),c=Math.max(0,r0((k-p*4-f*9)/4));return{k,p,c,f,adaptive:!!a}}

// ================= Gemini =================
const SYS=`You estimate nutrition for a personal calorie tracker. The user lives in Finland: packaging and nutrition labels are in Finnish and Swedish, energy is given in kJ and kcal, decimals use commas, values are per 100 g or 100 ml. Know Nordic foods, dishes and brands (Fazer, Valio, Pirkka, Rainbow, Kotimaista, Arla, Atria, HK, Saarioinen, Oatly) and typical Finnish portion sizes, but handle food from anywhere.
Rules: Return every distinct food on the plate as its own item with estimated edible weight in grams and nutrition per 100 g. If the photo is a nutrition label or product package, read the printed values exactly, return ONE item named after the product, grams = one serving if stated, otherwise 100. Use cooked weights for cooked food. Portions in photos are usually underestimated: when unsure, pick the larger plausible weight and count oils, butter, sauces and dressings. If a single fact would materially change the result (e.g. milk fat %, how many pieces, dressing or not), ask one short question in "question" while still giving best-guess items; otherwise leave question empty. Set barcode_visible true if a scannable barcode is visible. Understand Finnish and English text; write item names and the question in English unless the user wrote in Finnish.`;
const SCHEMA={type:'OBJECT',properties:{items:{type:'ARRAY',items:{type:'OBJECT',properties:{name:{type:'STRING'},grams:{type:'NUMBER'},kcal100:{type:'NUMBER'},protein100:{type:'NUMBER'},carbs100:{type:'NUMBER'},fat100:{type:'NUMBER'},fiber100:{type:'NUMBER'},confidence:{type:'STRING',enum:['high','medium','low']}},required:['name','grams','kcal100','protein100','carbs100','fat100','confidence']}},question:{type:'STRING'},barcode_visible:{type:'BOOLEAN'}},required:['items']};
// Two key types: AI Studio keys (AIza…) use the Gemini Developer API; Google Cloud keys bound to a service account (AQ.…) only work on the Vertex AI endpoint. Same request body either way.
const apiBase=()=>S.settings.api==='vertex'?'https://aiplatform.googleapis.com/v1/publishers/google/models/':'https://generativelanguage.googleapis.com/v1beta/models/';
async function gemini(parts){const s=S.settings;if(!s.key)throw new Error('Add your Gemini API key in Settings first.');
 const r=await fetch(`${apiBase()}${encodeURIComponent(s.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.key},
  body:JSON.stringify({system_instruction:{parts:[{text:SYS}]},contents:[{role:'user',parts}],generationConfig:{response_mime_type:'application/json',response_schema:SCHEMA,temperature:.2}})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('HTTP '+r.status));
 const txt=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';try{return JSON.parse(txt)}catch(e){throw new Error('Model returned no usable answer')}}
async function listModels(){if(S.settings.api==='vertex')throw new Error('Vertex keys cannot list models. Type a model name, e.g. gemini-3.8-flash');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=100`,{headers:{'x-goog-api-key':S.settings.key}});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
 return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const M=1024,sc=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=r0(img.width*sc);cv.height=r0(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);res(cv.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

// AI flow: photo and/or text -> editable item list -> entries
let ai=null; // {parts, img, res, meal, code}
async function aiStart({dataUrl,text,code}){const parts=[];if(dataUrl)parts.push({inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}});parts.push({text:text||(dataUrl?'What is in this photo? Estimate everything I would eat.':'')});
 ai={parts,img:dataUrl,res:null,meal:mealNow(),code,busy:true,err:null};renderAI();
 try{ai.res=await gemini(parts)}catch(e){ai.err=e.message}ai.busy=false;renderAI()}
async function aiAnswer(ans){if(!ans.trim())return;ai.parts=[...ai.parts,{text:`Your previous estimate: ${JSON.stringify(ai.res)}\nAnswer to your question: ${ans}\nUpdate the estimate.`}];ai.busy=true;ai.err=null;renderAI();
 try{ai.res=await gemini(ai.parts)}catch(e){ai.err=e.message}ai.busy=false;renderAI()}
function renderAI(){const a=ai,items=a.res?.items||[];
 modal(`<h3>${a.img?'Photo':'Described meal'}</h3>${a.img?`<img class="ph" src="${a.img}" alt="">`:`<p class="small muted" style="margin:0 0 8px">${esc(a.parts[0].text)}</p>`}
  ${a.busy?`<p class="b">Analysing<span class="dots">…</span></p>`:a.err?`<p class="lo">${esc(a.err)}</p><button class="btn block" data-act="ai-retry">Try again</button>`:`
  <div style="margin-top:8px">${items.map((it,i)=>`<div class="ai"><input type="checkbox" data-ai-on="${i}" checked><div class="nm"><div class="b">${esc(it.name)}${it.confidence!=='high'?` <span class="src ${it.confidence==='low'?'lo':''}">${it.confidence}</span>`:''}</div><div class="small muted">${r0(it.kcal100)} kcal/100 g · P ${r1(it.protein100)} C ${r1(it.carbs100)} F ${r1(it.fat100)}</div></div><input type="number" inputmode="decimal" data-ai-g="${i}" value="${r0(it.grams)}"><span class="small muted">g</span></div>`).join('')||'<p class="muted">Nothing recognised.</p>'}</div>
  <p class="r b" style="margin:8px 0">${r0(items.reduce((s,it)=>s+it.kcal100*it.grams/100,0)*mult())} kcal total${marginPct()?` <span class="small muted">incl. +${marginPct()}% margin</span>`:''}</p>
  ${a.res?.question?`<div class="card" style="background:var(--card2)"><div class="b small" style="margin-bottom:6px">${esc(a.res.question)}</div><div class="row"><input class="f" id="aians" style="margin:0" placeholder="Answer…"><button class="btn" data-act="ai-answer">Send</button></div></div>`:''}
  ${a.res?.barcode_visible&&!a.code?`<button class="btn block ghost" style="margin-bottom:8px" data-act="scan">Barcode visible: scan it for exact values</button>`:''}
  <div class="row"><select class="f" id="aimeal" style="margin:0;flex:1">${MEALS.map(([k,n])=>`<option value="${k}" ${k===a.meal?'selected':''}>${n}</option>`).join('')}</select><button class="btn acc" data-act="ai-add" ${items.length?'':'disabled'}>Add to ${fmtDay(day)}</button></div>
  <div class="row" style="margin-top:8px"><input class="f" id="aihint" style="margin:0;flex:1" placeholder="Correct it: e.g. 'that is oat milk, two slices'"><button class="btn" data-act="ai-answer">Send</button></div>`}`)}
// Safety margin: photo estimates scaled up by settings.margin %, typed descriptions by settings.marginText %. Label reads (ai.code set) are exact and get none.
const marginPct=()=>!ai||ai.code?0:(+(ai.img?S.settings.margin:S.settings.marginText)||0),mult=()=>1+marginPct()/100;
function aiAdd(){const items=ai.res.items,meal=$('#aimeal').value;let n=0;items.forEach((it,i)=>{if(!$(`[data-ai-on="${i}"]`).checked)return;const g=r0((+$(`[data-ai-g="${i}"]`).value||it.grams)*mult());
 const food={id:'ai:'+Date.now()+'-'+i,name:it.name,per:{k:r0(it.kcal100),p:r1(it.protein100),c:r1(it.carbs100),f:r1(it.fat100),fi:r1(it.fiber100),sa:0,su:0},units:[['annos',r0(g)]],src:ai.code?'label':'ai',code:ai.code};
 upsertFood(food);addEntry(food,g,meal);n++});closeModal();ai=null;toast(`Added ${n} item${n===1?'':'s'}`);render()}

// ================= foods, entries =================
function upsertFood(f){const i=S.foods.findIndex(x=>x.id===f.id||(f.code&&x.code===f.code));const old=i>=0?S.foods[i]:{uses:0};const nf={...old,...f,uses:(old.uses||0)+1,last:Date.now()};if(i>=0)S.foods[i]=nf;else S.foods.push(nf);if(S.foods.length>400)S.foods.sort((a,b)=>b.last-a.last).length=400}
function addEntry(food,g,meal){(S.log[day]=S.log[day]||[]).push({id:Date.now()+Math.random(),t:Date.now(),meal,name:food.name,brand:food.brand||'',g:+g,per:food.per,fid:food.id,src:food.src});save()}
function openFood(food,entry){const seen={1:1},units=[['g',1],...(food.units||[]).filter(u=>u[1]>0&&!seen[u[1]]&&(seen[u[1]]=1))];const g=entry?entry.g:(food.units?.[0]?.[1]||100);
 modal(`<h3>${esc(food.name)}</h3><p class="small muted" style="margin:-6px 0 10px">${food.brand?esc(food.brand)+' · ':''}${food.per.k} kcal · P ${food.per.p} · C ${food.per.c} · F ${food.per.f} per 100 g${food.src?`<span class="src">${food.src}</span>`:''}</p>
  <div class="row"><input class="f" type="number" inputmode="decimal" id="fg" value="${r0(g)}" style="margin:0;flex:1"><select class="f" id="fu" style="margin:0;flex:1.4">${units.map(([n,m],i)=>`<option value="${m}">${esc(n)}${m>1?` (${m} g)`:''}</option>`).join('')}</select></div>
  <p class="b r" id="fk" style="margin:8px 0"></p>
  <div class="row"><select class="f" id="fm" style="margin:0;flex:1">${MEALS.map(([k,n])=>`<option value="${k}" ${k===(entry?entry.meal:mealNow())?'selected':''}>${n}</option>`).join('')}</select><button class="btn acc" data-act="${entry?'ent-save':'food-add'}">${entry?'Save':'Add'}</button></div>
  ${entry?`<button class="btn block ghost danger" style="margin-top:10px" data-act="ent-del">Delete</button>`:''}`);
 const upd=()=>{const grams=+$('#fg').value*+$('#fu').value;$('#fk').textContent=`${r0(food.per.k*grams/100)} kcal · P ${r0(food.per.p*grams/100)} C ${r0(food.per.c*grams/100)} F ${r0(food.per.f*grams/100)}`};
 $('#fg').oninput=$('#fu').onchange=upd;upd();cur={food,entry}}
let cur=null;

// ================= search: own foods, Fineli (bundled), Open Food Facts =================
let fineli=null,offT=null,offRes=[],offWorld=false,q='';
async function loadFineli(){if(fineli)return fineli;try{fineli=(await (await fetch('fineli.json')).json()).map(r=>({id:'fin:'+r[0],name:r[1],en:r[2],per:{k:r[3],p:r[4],f:r[5],c:r[6],fi:r[7],sa:r[8],su:r[9]},units:r[11],src:'fineli'}))}catch(e){fineli=[]}return fineli}
function searchLocal(s){s=s.toLowerCase();const hit=f=>(f.name+' '+(f.en||'')+' '+(f.brand||'')).toLowerCase();
 const own=S.foods.filter(f=>hit(f).includes(s)).sort((a,b)=>b.uses-a.uses).slice(0,8);
 const fin=(fineli||[]).filter(f=>hit(f).includes(s)).sort((a,b)=>(hit(a).startsWith(s)?0:1)-(hit(b).startsWith(s)?0:1)||a.name.length-b.name.length).slice(0,25);return[...own,...fin]}
function offFood(p,code){const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;if(k==null)return null;

  case 'describe-q':aiStart({text:q});break;
  case 'describe-go':{const v=$('#desc').value.trim();if(v)aiStart({text:v});break}
  case 'ai-answer':{const el=$('#aians'),h=$('#aihint');aiAnswer((el&&el.value.trim())||(h&&h.value)||'');break}
  case 'ai-retry':ai.busy=true;ai.err=null;renderAI();try{ai.res=await gemini(ai.parts)}catch(e){ai.err=e.message}ai.busy=false;renderAI();break;
  case 'ai-add':aiAdd();break;
  case 'food-add':{const g=+$('#fg').value*+$('#fu').value;if(!(g>0))return;upsertFood(cur.food);addEntry(cur.food,g,$('#fm').value);closeModal();toast('Added');render();break}
  case 'ent-save':{const g=+$('#fg').value*+$('#fu').value;if(!(g>0))return;cur.entry.g=g;cur.entry.meal=$('#fm').value;save();closeModal();render();break}
  case 'ent-del':S.log[day]=entries(day).filter(e=>e!==cur.entry);save();closeModal();render();break;
  case 'copy':{const y=addD(day,-1);entries(y).filter(e=>e.meal===t.dataset.meal).forEach(e=>(S.log[day]=S.log[day]||[]).push({...e,id:Date.now()+Math.random(),t:Date.now()}));save();render();break}
  case 'quick':modal(`<h3>Quick add · ${mealName(t.dataset.meal)}</h3><input class="f" id="qn" placeholder="Name (optional)"><div class="row"><input class="f" type="number" inputmode="decimal" id="qk" placeholder="kcal" style="margin:0"><input class="f" type="number" inputmode="decimal" id="qp" placeholder="P g" style="margin:0"><input class="f" type="number" inputmode="decimal" id="qc" placeholder="C g" style="margin:0"><input class="f" type="number" inputmode="decimal" id="qf" placeholder="F g" style="margin:0"></div><button class="btn acc block" style="margin-top:10px" data-act="quick-go" data-meal="${t.dataset.meal}">Add</button>`);$('#qk').focus();break;
  case 'quick-go':{const k=+$('#qk').value;if(!(k>0))return;addEntry({id:'quick',name:$('#qn').value.trim()||'Quick add',per:{k,p:+$('#qp').value||0,c:+$('#qc').value||0,f:+$('#qf').value||0,fi:0,sa:0,su:0},src:'quick'},100,t.dataset.meal);closeModal();render();break}
  case 'water':S.water[day]=Math.max(0,(S.water[day]||0)+ +t.dataset.ml);save();render();break;
  case 'weigh':{const kg=+$('#wkg').value;if(!(kg>20&&kg<400))return;S.weight=S.weight.filter(w=>isoD(w.date)!==day);S.weight.push({date:dayMs(day),kg});save();toast('Weight logged');render();break}
  case 'health':{const n=S.settings.shortcut;if(!n){toast('Set the Shortcut name in Settings');return}location.href='shortcuts://run-shortcut?name='+encodeURIComponent(n)+'&input=text&text='+encodeURIComponent(t.dataset.k);break}
  case 'models':try{const ms=await listModels();$('#models').innerHTML=ms.map(m=>`<option value="${esc(m)}">`).join('');toast(`${ms.length} models — tap the field`)}catch(e){toast(e.message)}break;
  case 'export':share(JSON.stringify(S,null,1),`kcal-backup-${today()}.json`,'application/json');break;
  case 'import':$('#imp').click();break;
  case 'csv':share(csv(),`kcal-${today()}.csv`,'text/csv');break;
  case 'wipe':if(confirm('Erase all food logs, foods and weights in this app? Lifts data is not touched. Export first if unsure.')){localStorage.removeItem(KEY);S=defaults();render()}break;
 }});
$('#photo').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{aiStart({dataUrl:await shrink(f),code:pendingCode,text:pendingCode?'This is the nutrition label of a packaged product. Read it exactly.':undefined})}catch(e){toast('Could not read the photo')}});
$('#imp').addEventListener('change',ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.log||!d.settings)throw 0;S={...defaults(),...d};save();toast('Restored');render()}catch(e){alert('Not a valid Kcal backup')}})});
document.addEventListener('change',ev=>{const k=ev.target.dataset.set;if(!k)return;const el=ev.target;const v=el.type==='checkbox'?el.checked:(el.type==='number'||(el.tagName==='SELECT'&&el.value!==''&&!isNaN(el.value)))?+el.value:el.value;S.settings[k]=v;save();if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='number')render()});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target.id==='code')lookup(ev.target.value);if(ev.target.id==='aians'||ev.target.id==='aihint')aiAnswer(ev.target.value)});
function csv(){const rows=[['date','time','meal','name','brand','grams','kcal','protein_g','carbs_g','fat_g','fibre_g','salt_g','source']];Object.keys(S.log).sort().forEach(d=>S.log[d].forEach(e=>rows.push([d,new Date(e.t).toTimeString().slice(0,5),mealName(e.meal),e.name,e.brand,r0(e.g),r0(kcal(e)),r1(mac(e,'p')),r1(mac(e,'c')),r1(mac(e,'f')),r1(mac(e,'fi')),r1(mac(e,'sa')),e.src])));
 rows.push([]);rows.push(['date','weight_kg','source']);allWeights().forEach(w=>rows.push([isoD(w.date),w.kg,w.src]));return rows.map(r=>r.map(v=>/[",\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n')}
async function share(text,name,type){const file=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click()}
render();
</script>
</body>
</html>
