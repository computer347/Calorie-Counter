name: Fetch today's student lunch menus
on:
  schedule:
    - cron: '15 5 * * 1-5'   # 07:15 Helsinki in winter, 08:15 in summer; weekdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lunch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/lunch.mjs > lunch.json
      - run: |
          git config user.name "lunch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lunch.json
          git diff --cached --quiet || (git commit -m "lunch.json for $(date -u +%F)" && git push)
